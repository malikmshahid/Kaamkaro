<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · KaamKaro</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8f5ee;
        color: #14251b;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        max-width: 420px;
        border: 1px solid #e2dac8;
        background: #fffefb;
        border-radius: 20px;
        padding: 32px 28px;
        box-shadow: 0 24px 60px -40px rgba(18, 58, 38, 0.5);
        text-align: center;
      }
      .mark {
        width: 56px; height: 56px; border-radius: 16px; background: #123a26;
        display: grid; place-items: center; margin: 0 auto 18px;
        color: #c8963e; font-size: 26px; font-weight: 700;
      }
      h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { color: #4b5b51; font-size: 14.5px; line-height: 1.6; margin: 0 0 20px; }
      a {
        display: inline-block; background: #1c5236; color: #f8f5ee;
        text-decoration: none; font-size: 14px; font-weight: 600;
        padding: 12px 22px; border-radius: 999px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0e1109; color: #f1e0c1; }
        .card { background: #171b12; border-color: #2f3327; }
        p { color: #b9c4ba; }
        a { background: #2f8354; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">K</div>
      <h1>You&rsquo;re offline</h1>
      <p>
        KaamKaro needs a connection to load live task, escrow and message data — we never show a
        cached copy of anything involving money. Reconnect and try again.
      </p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
